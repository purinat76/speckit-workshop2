<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Photo Album Organizer - Organize and browse your photos in albums grouped by date."
    />
    <title>Photo Album Organizer</title>
    <link rel="stylesheet" href="/src/styles/base.css" />
    <link rel="stylesheet" href="/src/styles/layout.css" />
    <link rel="stylesheet" href="/src/styles/accessibility.css" />
  </head>
  <body>
    <!-- Skip to main content link for keyboard users -->
    <a href="#main-content" class="skip-to-main">Skip to main content</a>

    <!-- Header -->
    <header role="banner">
      <h1>Photo Album Organizer</h1>
      <p class="subtitle">Organize and browse your photo collection</p>
    </header>

    <!-- Main content area -->
    <main id="main-content" role="main">
      <div id="app-container"></div>
    </main>

    <!-- Screen reader announcements area -->
    <div
      id="sr-announcements"
      role="region"
      aria-live="polite"
      aria-atomic="true"
      class="sr-only"
    ></div>

    <!-- Footer -->
    <footer role="contentinfo">
      <p>&copy; 2025 Photo Album Organizer. All rights reserved.</p>
    </footer>

    <!-- Main application script -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
